<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sobre Aiden Jiménez: skills, experiencia, estudios y lo que le gusta.">
    <meta name="theme-color" content="#f2f2f8">
    <!-- Aplica el tema antes de pintar para evitar un parpadeo (claro por defecto) -->
    <script>(function(){var t;try{t=localStorage.getItem("portfolio-theme")}catch(e){}if(t!=="dark")document.documentElement.dataset.theme="light"})()</script>
    <link rel="icon" href="img/battery.svg?v=16" type="image/svg+xml">
    <link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css?v=16">
    <!-- Hoja de impresión: al imprimir o "Guardar como PDF" esta página sale como un CV en A4 -->
    <link rel="stylesheet" href="css/print.css?v=16" media="print">
    <title>303/AIDEN - Portfolio</title>
</head>

<body data-page="about">
    <div class="bg-fx" aria-hidden="true"><div class="bg-fx__cols"></div></div>

    <div data-include="header"></div>

    <!-- ============ CABECERA DEL CV (solo en impresión; la rellena js/print.js) ============ -->
    <header class="print-cv" hidden data-print-only>
        <p class="print-cv__rail mono"><span data-i18n="print.doc"></span></p>
        <div class="print-cv__grid">
            <div>
                <p class="print-cv__name" data-print-name></p>
                <p class="print-cv__role mono" data-print-role></p>
            </div>
            <dl class="spec mono print-cv__spec" data-print-contact></dl>
        </div>
    </header>

    <main id="main" class="page">

        <!-- ============ SOBRE MÍ ============ -->
        <section class="section about-section" id="about" aria-labelledby="about-title">
            <div class="container">
                <p class="section-index mono"><span>/01 <span data-i18n="about.heading"></span></span><span data-about-where></span></p>
            </div>
            <div class="container about">
                <div class="about__text" data-reveal>
                    <h1 class="about__hello" id="about-title"><span data-about-hello></span><br><span class="about__name" data-about-name></span></h1>
                    <p class="about__lead" data-about-lead></p>
                    <h2 class="section-title" hidden data-print-only><span data-i18n="print.profile"></span></h2>
                    <p class="about__body" data-about-body></p>
                    <div class="about-actions">
                        <a class="btn btn--primary about__linkedin" data-linkedin target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                            <span data-linkedin-label></span>
                        </a>
                        <!-- CV: el PDF subido a documentos/ y la versión imprimible de esta misma página -->
                        <a class="btn btn--ghost" data-cv download>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
                            <span data-i18n="print.download"></span>
                        </a>
                        <button class="btn btn--ghost" type="button" data-print-btn>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-8h16v8h-3M7 14h10v7H7z"/></svg>
                            <span data-i18n="print.button"></span>
                        </button>
                    </div>
                    <dl class="stats" data-stats></dl>
                </div>

                <figure class="about-photo" data-reveal>
                    <div class="about-photo__stack">
                        <div class="about-photo__block" aria-hidden="true"></div>
                        <div class="about-photo__frame">
                            <span class="about-photo__circle" aria-hidden="true"></span>
                            <img data-photo alt="" width="400" height="480">
                            <span class="corner corner--tl"></span><span class="corner corner--tr"></span>
                            <span class="corner corner--bl"></span><span class="corner corner--br"></span>
                        </div>
                    </div>
                    <div class="about-photo__tags" data-about-tags></div>
                    <div class="about-contact">
                        <h2 data-i18n="about.contact"></h2>
                        <ul data-contact-list></ul>
                    </div>
                </figure>
            </div>
        </section>

        <!-- ============ PROCESO DE TRABAJO (estilo Riley) ============ -->
        <section class="section section--band" id="process" aria-labelledby="process-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <p class="section-index mono" aria-hidden="true"><span>/02</span><span data-count="process"></span></p>
                    <h2 class="section-title" id="process-title" data-reveal data-scramble><span data-i18n="process.heading"></span></h2>
                    <p class="section-intro" data-i18n="process.intro"></p>
                </header>
                <div class="process" data-process data-reveal></div>
            </div>
        </section>

        <!-- ============ SKILLS ============ -->
        <section class="section" id="skills" aria-labelledby="skills-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <p class="section-index mono" aria-hidden="true"><span>/03</span><span data-count="skills"></span></p>
                    <h2 class="section-title" id="skills-title" data-reveal data-scramble><span data-i18n="skills.heading"></span></h2>
                </header>

                <div class="skills">
                    <div data-reveal>
                        <h3 class="sub-title" data-i18n="skills.software"></h3>
                        <ul class="skill-grid" data-skill-grid></ul>
                    </div>
                    <div data-reveal>
                        <h3 class="sub-title" data-i18n="skills.soft"></h3>
                        <ul class="soft-list" data-soft-list></ul>
                        <h3 class="sub-title sub-title--spaced" data-i18n="about.languages"></h3>
                        <ul class="lang-list" data-lang-list></ul>
                        <!-- Otros eventos en la columna lateral del CV impreso (copia de la lista de "Experiencia", la rellena js/print.js) -->
                        <div class="print-awards" hidden data-print-only>
                            <h3 class="sub-title sub-title--spaced" data-i18n="exp.awards"></h3>
                            <ol class="timeline" data-print-awards></ol>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ============ EXPERIENCIA + ESTUDIOS ============ -->
        <section class="section section--band" id="experience" aria-labelledby="exp-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <p class="section-index mono" aria-hidden="true"><span>/04</span><span data-count="exp"></span></p>
                    <h2 class="section-title" id="exp-title" data-reveal data-scramble><span data-i18n="exp.heading"></span></h2>
                </header>
                <ol class="timeline" data-experience></ol>

                <h3 class="section-title section-title--sm" data-reveal data-scramble><span data-i18n="exp.studies"></span></h3>
                <ol class="timeline" data-studies></ol>

                <h3 class="section-title section-title--sm section-title--awards" data-reveal data-scramble><span data-i18n="exp.awards"></span></h3>
                <ol class="timeline" data-awards></ol>
            </div>
        </section>

        <!-- ============ COSAS QUE ME GUSTAN ============ -->
        <section class="section" id="hobbies" aria-labelledby="hobbies-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <p class="section-index mono" aria-hidden="true"><span>/05</span><span data-count="hobbies"></span></p>
                    <h2 class="section-title" id="hobbies-title" data-reveal data-scramble><span data-i18n="hobbies.heading"></span></h2>
                    <p class="section-intro" data-i18n="hobbies.intro"></p>
                </header>
            </div>
            <div class="marquee marquee--auto" data-reveal>
                <ul class="marquee__track" data-hobbies></ul>
            </div>
        </section>
    </main>

    <div data-include="footer"></div>

    <script src="data/profile.js?v=16"></script>
    <script src="data/projects.js?v=16"></script>
    <script src="js/i18n.js?v=16"></script>
    <script src="js/main.js?v=16"></script>
    <script src="js/sections.js?v=16"></script>
    <script src="js/print.js?v=16"></script>
</body>
</html>
