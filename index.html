<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de Aiden Jiménez, desarrollador web y diseñador gráfico.">
    <meta name="theme-color" content="#f2f2f8">
    <meta property="og:title" content="303/AIDEN - Portfolio">
    <meta property="og:description" content="Desarrollador web & diseñador gráfico · Web developer & graphic designer">
    <meta property="og:image" content="img/projects/fitpup-laravel/cover.jpg">
    <!-- Aplica el tema antes de pintar para evitar un parpadeo (claro por defecto) -->
    <script>(function(){var t;try{t=localStorage.getItem("portfolio-theme")}catch(e){}if(t!=="dark")document.documentElement.dataset.theme="light"})()</script>
    <link rel="icon" href="img/battery.svg?v=12" type="image/svg+xml">
    <link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css?v=12">
    <title>303/AIDEN - Portfolio</title>
</head>

<body data-page="home">
    <div class="bg-fx" aria-hidden="true"><div class="bg-fx__cols"></div></div>

    <div data-include="header"></div>

    <main id="main">

        <!-- ============ HOME ============ -->
        <section class="hero" aria-labelledby="hero-name">
            <div class="container">
                <div class="hero__rail mono" aria-hidden="true">
                    <span class="hero__index">/00</span>
                    <span data-i18n="hero.index"></span>
                    <span class="hero__coords" data-coords>X 0000 · Y 0000</span>
                    <span class="hero__ref">ARCH-303-2026</span>
                </div>

                <div class="hero__grid">
                    <div class="hero__main">
                        <h1 class="hero-name" id="hero-name" data-name></h1>
                        <p class="hero-role" data-role-visible></p>

                        <dl class="spec mono">
                            <div class="spec__row"><dt data-i18n="hero.spec.role"></dt><dd data-role></dd></div>
                            <div class="spec__row"><dt data-i18n="hero.spec.base"></dt><dd data-location></dd></div>
                            <div class="spec__row"><dt data-i18n="hero.spec.time"></dt><dd data-local-time></dd></div>
                            <div class="spec__row" data-status hidden><dt data-i18n="hero.spec.status"></dt><dd class="spec__open"><span class="status-dot"></span><span data-i18n="hero.status"></span></dd></div>
                        </dl>

                        <a class="btn btn--primary btn--lg" href="#contact"><span data-i18n="hero.cta.contact"></span> <span class="btn__arrow" aria-hidden="true">↗</span></a>
                    </div>

                    <figure class="machine" data-machine>
                        <div class="monitor">
                            <div class="monitor__bezel">
                                <div class="monitor__screen">
                                    <div class="screen-bar mono" aria-hidden="true">
                                        <span class="screen-bar__dots"><i></i><i></i><i></i></span>
                                        <span>~/portfolio — zsh</span>
                                        <span class="screen-bar__clock" data-clock></span>
                                    </div>
                                    <div class="screen-body mono" aria-hidden="true">
                                        <div class="screen-text">
                                            <p class="boot">&gt; <span data-boot></span></p>
                                            <p class="term"><span class="term__prompt">$</span> whoami</p>
                                            <p class="term term--out" data-whoami></p>
                                            <p class="term"><span class="term__prompt">$</span> cat role.txt</p>
                                            <p class="term term--out hero-titles"><span data-typed></span><span class="caret">▍</span></p>
                                        </div>
                                        <div class="screen-logo">
                                            <img class="screen-logo__light" src="img/logo.svg?v=12" alt="" width="200" height="200">
                                            <img class="screen-logo__ink" src="img/logo-ink.svg?v=12" alt="" width="200" height="200">
                                        </div>
                                    </div>
                                </div>
                                <div class="monitor__chin" aria-hidden="true">
                                    <span class="monitor__brand mono">303·PC</span>
                                    <span class="monitor__vents"></span>
                                    <span class="monitor__knobs"><i></i><i></i></span>
                                    <span class="monitor__power"><span class="monitor__led"></span></span>
                                </div>

                                <aside class="sticky-note">
                                    <span class="sticky-note__tape" aria-hidden="true"></span>
                                    <p data-sticky-text></p>
                                </aside>
                            </div>
                            <div class="monitor__neck" aria-hidden="true"></div>
                            <div class="computer-case" aria-hidden="true">
                                <span class="computer-case__label mono">303/AIDEN</span>
                                <span class="computer-case__floppy"><i></i></span>
                                <span class="computer-case__leds"><i></i><i></i></span>
                                <span class="computer-case__vents"></span>
                            </div>
                        </div>
                        <!-- Cotas reales del monitor (las mide js/sections.js) -->
                        <span class="dim dim--w mono" aria-hidden="true"><span data-dim-w></span></span>
                        <span class="dim dim--h mono" aria-hidden="true"><span data-dim-h></span></span>
                        <ol class="notes mono" aria-hidden="true">
                            <li class="note note--1"><b>01</b><span data-i18n="hero.note.screen"></span></li>
                            <li class="note note--2"><b>02</b><span data-i18n="hero.note.case"></span></li>
                        </ol>
                    </figure>
                </div>
            </div>
        </section>

        <!-- ============ PROYECTOS ============ -->
        <section class="section section--projects section--band" id="projects" aria-labelledby="projects-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <p class="section-index mono" aria-hidden="true"><span>/01</span><span data-project-count></span></p>
                    <h2 class="section-title" id="projects-title" data-reveal data-scramble><span data-i18n="projects.heading"></span></h2>
                    <p class="section-intro" data-i18n="projects.intro"></p>
                </header>
                <div class="filters" role="group" aria-labelledby="projects-title" data-filters data-reveal></div>
            </div>

            <div class="carousel" data-carousel data-reveal>
                <button class="carousel__btn carousel__btn--prev icon-btn" type="button" data-carousel-prev data-i18n-attr="aria-label:projects.prev,title:projects.prev">←</button>
                <div class="marquee marquee--js">
                    <div class="marquee__track" data-marquee role="list"></div>
                </div>
                <button class="carousel__btn carousel__btn--next icon-btn" type="button" data-carousel-next data-i18n-attr="aria-label:projects.next,title:projects.next">→</button>
            </div>
            <p class="container marquee__empty" data-empty hidden data-i18n="projects.empty"></p>
        </section>
    </main>

    <div data-include="footer"></div>

    <script src="data/profile.js?v=12"></script>
    <script src="data/projects.js?v=12"></script>
    <script src="js/i18n.js?v=12"></script>
    <script src="js/main.js?v=12"></script>
    <script src="js/sections.js?v=12"></script>
</body>
</html>
