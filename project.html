<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proyecto del portfolio de Aiden Jiménez.">
    <meta name="theme-color" content="#f2f2f8">
    <!-- Aplica el tema antes de pintar para evitar un parpadeo (claro por defecto) -->
    <script>(function(){var t;try{t=localStorage.getItem("portfolio-theme")}catch(e){}if(t!=="dark")document.documentElement.dataset.theme="light"})()</script>
    <link rel="icon" href="img/battery.svg?v=14" type="image/svg+xml">
    <link rel="preload" href="fonts/syncopate-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css?v=14">
    <title>303/AIDEN - Portfolio</title>
</head>

<body data-page="project">
    <div class="bg-fx" aria-hidden="true"><div class="bg-fx__grid"></div><div class="bg-fx__glow"></div><div class="bg-fx__marks"></div></div>

    <div data-include="header"></div>

    <main id="main" class="project-page">
        <div class="container" data-project>
            <!-- Se rellena desde js/project.js con los datos de data/projects.js -->
        </div>
    </main>

    <div class="lightbox" data-lightbox hidden>
        <button class="lightbox__close icon-btn" type="button" data-lightbox-close data-i18n-attr="aria-label:project.close">✕</button>
        <button class="lightbox__nav lightbox__nav--prev icon-btn" type="button" data-lightbox-prev data-i18n-attr="aria-label:project.prev">←</button>
        <figure>
            <img data-lightbox-img alt="">
            <figcaption class="mono" data-lightbox-caption></figcaption>
        </figure>
        <button class="lightbox__nav lightbox__nav--next icon-btn" type="button" data-lightbox-next data-i18n-attr="aria-label:project.next">→</button>
    </div>

    <div data-include="footer"></div>

    <script src="data/profile.js?v=14"></script>
    <script src="data/projects.js?v=14"></script>
    <script src="js/i18n.js?v=14"></script>
    <script src="js/main.js?v=14"></script>
    <script src="js/project.js?v=14"></script>
</body>
</html>
